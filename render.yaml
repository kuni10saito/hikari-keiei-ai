# Render Blueprint
# https://render.com/docs/blueprint-spec
#
# 使い方: Render のダッシュボードで New → Blueprint を選び、このリポジトリを指定する。
# 秘密情報（sync: false のもの）は、その場でダッシュボードに入力を求められる。
# リポジトリには絶対に書かないこと。

services:
  - type: web
    name: hikari-keiei-ai
    runtime: python
    plan: starter          # 永続ディスクには有料プランが必要。free では動かない
    region: singapore      # 日本から最も近いリージョン

    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /

    # 永続ディスク。usage.sqlite3（利用上限の判定）と outputs/（生成物）を置く。
    # これが無いと再デプロイのたびに利用上限がリセットされ、課金の歯止めが外れる。
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # 書き込み先を永続ディスクへ向ける。app.py / db.py がこれを見る。
      - key: DATA_DIR
        value: /var/data

      # ── 使用する会社 ──────────────────────────────
      # ここを書き換えて push すると会社が切り替わる。
      # 対になる _data.json はファイル名の規則で自動選択される。
      #   company.md           → 株式会社ヒカリ（演習用の架空財務・3期）
      #   company_pacolabo.md  → パコラボ株式会社（第10期決算・実データ）
      #   company_atsuta.md    → あつた鶏飯 Re-Name Project（2026年5月・実データ）
      #
      # 切り替えたら会話履歴のリセットを忘れないこと:
      #   /api/admin/reset?key=...&student_id=...
      - key: COMPANY_FILE
        value: company_atsuta.md

      # --- 秘密情報・個人情報：ダッシュボードで入力する ---
      # （リポジトリには保存されない。ROSTER は学籍番号なのでここに書かない）
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLASS_PASSWORD
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ROSTER
        sync: false

      # --- 利用上限（受講者2名想定）---
      # 日次は毎日リセットされるので、最終的な歯止めは通算の方。
      - key: DAILY_YEN_CAP
        value: "300"
      - key: DAILY_TOTAL_YEN_CAP
        value: "600"
      - key: PERIOD_YEN_CAP
        value: "500"
      - key: PERIOD_TOTAL_YEN_CAP
        value: "1200"
      - key: USD_JPY
        value: "155"

      # スライドは1回 約156円（Excel の約9倍）。学生1人あたりの作成回数。
      # 0 にすると pptx スキル自体を渡さず、完全に封じられる。
      - key: PPTX_LIMIT
        value: "1"

      # 思考の深さ。成果物の質が落ちるようなら high に戻す。
      - key: EFFORT
        value: "medium"
